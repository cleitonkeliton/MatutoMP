<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Por que investir — Proposta Matuto Motos</title>
<link rel="stylesheet" href="../../prototipo/assets/css/base.css">
<link rel="stylesheet" href="molduras.css">
<style>
  .palco { width: 1920px; height: 1080px; }
  .topo { position: absolute; left: 80px; right: 80px; top: 50px; display: flex; align-items: center; gap: 20px; }
  .topo .selo { width: 84px; }
  .topo h1 { margin: 0; font-family: var(--f-titulo); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 54px; line-height: 1; }
  .topo h1 em { color: #FCDD08; font-style: italic; }
  .topo p { margin: 6px 0 0; font-size: 19px; color: rgba(255, 255, 255, .7); }
  .topo .dir { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 15px; color: rgba(255, 255, 255, .6); text-align: right; }
  .topo .dir [data-assinatura] { --logo-h: 42px; --logo-txt: 28px; }

  .corpo { position: absolute; left: 80px; right: 80px; top: 180px; display: grid; grid-template-columns: 500px 1fr; gap: 28px; }
  .numeros { display: flex; flex-direction: column; gap: 16px; }
  .num { border-radius: 20px; padding: 20px 24px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .14); }
  .num b { display: block; font-family: var(--f-texto); font-weight: 750; font-size: 46px; line-height: 1.05; letter-spacing: -.02em; color: #fff; white-space: nowrap; }
  .num span strong { font-weight: 800; }
  .num b em { font-style: normal; color: #FCDD08; }
  .num span { display: block; font-size: 16.5px; line-height: 1.4; color: rgba(255, 255, 255, .75); margin-top: 6px; }
  .num.amarelo { background: #FCDD08; border-color: #FCDD08; }
  .num.amarelo b, .num.amarelo span { color: var(--preto); }
  .num.amarelo b em { color: var(--vermelho); }

  .motivos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .mot { background: #fff; color: var(--texto); border-radius: 18px; padding: 20px 22px; display: flex; gap: 16px; align-items: flex-start; }
  .mot > div { display: flex; flex-direction: column; gap: 8px; }
  .mot i { flex: none; width: 52px; height: 52px; border-radius: 14px; background: #FCDD08; display: flex; align-items: center; justify-content: center; }
  .mot i .ic { width: 26px; height: 26px; }
  .mot h3 { margin: 4px 0 0; font-family: var(--f-titulo); font-weight: 800; text-transform: uppercase; font-size: 25px; line-height: 1.05; letter-spacing: .01em; }
  .mot p { margin: 0; font-size: 17px; line-height: 1.45; color: var(--texto-2); }

  .cenarios { position: absolute; left: 80px; right: 80px; top: 668px; display: grid; grid-template-columns: 300px repeat(3, 1fr); gap: 16px; align-items: stretch; }
  .cen-tit { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .cen-tit b { font-family: var(--f-titulo); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 30px; line-height: .95; color: #fff; }
  .cen-tit span { font-size: 15px; line-height: 1.4; color: rgba(255, 255, 255, .65); }
  .cen { border-radius: 18px; padding: 16px 20px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .14); display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; align-items: center; }
  .cen-n { grid-row: 1 / span 2; font-family: var(--f-titulo); font-weight: 800; font-size: 58px; line-height: .9; color: #FCDD08; text-align: center; }
  .cen-n small { display: block; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .7); margin-top: 4px; }
  .cen-v { font-size: 15.5px; color: rgba(255, 255, 255, .78); line-height: 1.35; }
  .cen-v b { display: block; font-family: var(--f-texto); font-weight: 750; font-size: 27px; color: #fff; letter-spacing: -.01em; }
  .cen-p { font-size: 15.5px; color: rgba(255, 255, 255, .78); }
  .cen-p b { color: #FCDD08; }
  .equilibrio { position: absolute; left: 80px; right: 80px; top: 846px; display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; border-radius: 20px; padding: 20px 28px; background: rgba(252, 221, 8, .1); border: 2px solid #FCDD08; }
  .eq-num { font-family: var(--f-titulo); font-weight: 800; font-style: italic; text-transform: uppercase; color: #FCDD08; font-size: 64px; line-height: .9; white-space: nowrap; }
  .eq-num small { display: block; font-size: 24px; color: #fff; font-style: normal; letter-spacing: .02em; margin-top: 4px; }
  .eq-txt { font-size: 18px; line-height: 1.45; color: rgba(255, 255, 255, .9); }
  .eq-txt b { color: #fff; }
  .eq-txt small { display: block; font-size: 13.5px; color: rgba(255, 255, 255, .55); margin-top: 6px; }
  .listra { bottom: 0; }
</style>
</head>
<body>
<div class="palco">
  <div class="topo"><div id="selo"></div><div><h1>Por que investir · <em>o site se paga</em></h1><p>O Instagram já traz o cliente. A loja transforma seguidor em pedido pago, sem frete e sem fila no WhatsApp.</p></div><div class="dir"><div data-assinatura></div><span>Proposta de loja virtual — Matuto Motos · novembro de 2026</span></div></div>
  <div class="corpo">
    <div class="numeros" id="numeros"></div>
    <div class="motivos" id="motivos"></div>
  </div>
  <div class="cenarios" id="cenarios"></div>
  <div class="equilibrio" id="equilibrio"></div>
  <div class="listra"></div>
</div>
<script src="../../prototipo/assets/js/icones.js"></script>
<script src="proposta.js"></script>
<script src="assinatura.js"></script>
<script>
(function () {
  const P = window.PROPOSTA, I = window.ICON;
  const brl = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  const dec = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  document.getElementById('selo').innerHTML = window.SELO();
  document.getElementById('numeros').innerHTML =
    '<div class="num"><b><em>204 mil</em> seguidores</b><span>e 1.355 posts. O público já existe: hoje cada post termina em “chama no WhatsApp”.</span></div>' +
    '<div class="num"><b>24 horas <em>por dia</em></b><span>A loja abre de segunda a sexta, das 8h às 18h. O site recebe pedidos pagos à noite e no fim de semana.</span></div>' +
    '<div class="num amarelo"><b>Pix ' + P.comparativo.pix.replace('cerca de ', '≈ ') + '</b><span>de taxa por venda no site. No Mercado Livre, a comissão é <strong>' + P.comparativo.marketplace + '</strong>. E sem frete: a retirada é no balcão.</span></div>';
  const motivos = [
    ['insta', 'Seguidor vira cliente', 'O link da bio e cada story levam direto à peça, com preço, estoque e “Retira hoje”.'],
    ['whatsapp', 'Menos tempo no WhatsApp', 'Preço, compatibilidade e estoque respondidos pelo site. O aviso de pedido pronto sai sozinho.'],
    ['store', 'Balcão sem fila e sem erro', 'O pedido chega pago e separado, com o local na prateleira, e é conferido por código.'],
    ['box', 'Estoque confiável', 'O pedido reserva a peça e a baixa é na retirada. Alertas e “Avise-me” mostram o que repor.'],
    ['moto', 'Clientes e motos cadastrados', 'Com a Minha garagem, a oferta certa vai para quem tem a moto certa, como kit relação para Titan 160.'],
    ['wrench', 'Novo canal com oficinas', 'Cadastro por CNPJ e preço de atacado trazem compra recorrente das oficinas da região.'],
  ];
  document.getElementById('motivos').innerHTML = motivos.map((m) => '<div class="mot"><i>' + I(m[0]) + '</i><div><h3>' + m[1] + '</h3><p>' + m[2] + '</p></div></div>').join('');

  /* ponto de equilíbrio do pacote da simulação */
  const s = P.simulacao, pac = P.pacotes.find((p) => p.id === s.pacote);
  const porPedido = s.ticket * (s.margem - s.taxaPix);
  const anoUm = pac.implantacao + 12 * pac.mensal;
  const pedidosMes = anoUm / 12 / porPedido;
  const porDia = pedidosMes / s.diasUteis;
  const depois = Math.ceil(pac.mensal / porPedido);
  const cen = s.cenarios.map((n) => {
    const pedidos = n * s.diasUteis, vendas = pedidos * s.ticket;
    const sobra = pedidos * porPedido - pac.mensal;
    return '<div class="cen"><div class="cen-n">' + n + '<small>pedidos/dia</small></div>' +
      '<div class="cen-v"><b>R$ ' + brl(vendas) + '</b>em vendas novas por mês</div>' +
      '<div class="cen-p">Implantação paga em <b>' + Math.max(1, Math.ceil(pac.implantacao / sobra)) + ' ' + (Math.ceil(pac.implantacao / sobra) > 1 ? 'meses' : 'mês') + '</b></div></div>';
  }).join('');
  document.getElementById('cenarios').innerHTML = '<div class="cen-tit"><b>E se vender mais?</b><span>Retorno do pacote ' + pac.nome + ' em três cenários de pedidos novos por dia útil.</span></div>' + cen;
  document.getElementById('equilibrio').innerHTML =
    '<div class="eq-num">≈ ' + dec(porDia) + ' pedido<small>por dia útil</small></div>' +
    '<div class="eq-txt"><b>Paga o pacote ' + pac.nome + ' no primeiro ano</b> (implantação de R$ ' + brl(pac.implantacao) + ' + 12 mensalidades = R$ ' + brl(anoUm) + '), ' +
      'cerca de ' + Math.round(pedidosMes) + ' pedidos novos por mês. Do segundo ano em diante, ' + depois + ' pedidos por mês cobrem a mensalidade.' +
      '<small>Simulação com ticket médio de R$ ' + brl(s.ticket) + ', margem de ' + Math.round(s.margem * 100) + '% e taxa do Pix descontada. Ajustar com os números reais da loja.</small></div>';
})();
</script>
</body>
</html>
